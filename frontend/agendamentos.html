<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamentos | Hospital John Knox</title>

  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="cabecalho">
    <div class="container cabecalho-conteudo">
      <a href="index.html" class="marca">Hospital <span>John Knox</span></a>

      <nav class="navegacao">
        <a href="pessoas.html">Pessoas</a>
        <a href="usuarios.html">Usuários</a>
        <a href="pacientes.html">Pacientes</a>
        <a href="agendamentos.html" class="ativo">Agendamentos</a>
      </nav>
    </div>
  </header>

  <main class="conteudo">

    <!-- Formulário (cadastro e edição) -->
    <section class="caixa cadastro">
      <h1 id="titulo-formulario">Novo agendamento</h1>
      <p class="cadastro-texto" id="texto-formulario">Marque uma consulta para um paciente.</p>

      <form class="formulario" id="form-agendamento">
        <label class="campo">
          <span>Paciente</span>
          <select name="paciente_id" id="select-paciente" required></select>
        </label>

        <label class="campo">
          <span>Médico</span>
          <select name="medico_id" id="select-medico" required></select>
        </label>

        <label class="campo">
          <span>Data e horário</span>
          <input type="datetime-local" name="data_hora" required>
        </label>

        <label class="campo" id="campo-status" hidden>
          <span>Status</span>
          <select name="status">
            <option value="agendado">Agendado</option>
            <option value="realizado">Realizado</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </label>

        <div class="formulario-botoes">
          <button type="submit" class="botao botao-principal" id="botao-salvar">Agendar</button>
          <button type="button" class="botao botao-contorno" id="botao-cancelar" hidden>Cancelar edição</button>
        </div>
      </form>

      <!-- Mensagem de sucesso ou erro -->
      <p class="mensagem" id="mensagem" hidden></p>
    </section>

    <!-- Lista de agendamentos -->
    <section class="caixa">
      <div class="caixa-cabecalho">
        <h2>Agendamentos</h2>
        <span class="contador" id="contador">0</span>
      </div>

      <div class="tabela-rolagem" id="tabela-agendamentos">
        <table class="tabela">
          <thead>
            <tr>
              <th>Paciente</th>
              <th>Data</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="lista-agendamentos"></tbody>
        </table>
      </div>

      <p class="lista-vazia" id="lista-vazia" hidden>Nenhum agendamento cadastrado ainda.</p>
    </section>

  </main>

  <!-- Rodapé -->
  <footer class="rodape">
    <div class="container">
      Hospital John Knox · <span id="ano"></span>
    </div>
  </footer>

  <script src="js/comum.js"></script>
  <script src="js/agendamentos.js"></script>
</body>
</html>
