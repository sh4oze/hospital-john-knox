<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários | Hospital John Knox</title>

  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="cabecalho">
    <div class="container cabecalho-conteudo">
      <a href="index.html" class="marca">Hospital <span>John Knox</span></a>

      <nav class="navegacao">
        <a href="pessoas.html">Pessoas</a>
        <a href="usuarios.html" class="ativo">Usuários</a>
        <a href="pacientes.html">Pacientes</a>
        <a href="agendamentos.html">Agendamentos</a>
      </nav>
    </div>
  </header>

  <main class="conteudo">

    <!-- Formulário (cadastro e edição) -->
    <section class="caixa cadastro">
      <h1 id="titulo-formulario">Cadastro de usuário</h1>
      <p class="cadastro-texto" id="texto-formulario">Crie o acesso de uma pessoa ao sistema.</p>

      <form class="formulario" id="form-usuario">
        <label class="campo">
          <span>Pessoa</span>
          <select name="pessoa_id" id="select-pessoa" required></select>
        </label>

        <label class="campo">
          <span>Login</span>
          <input type="text" name="login" minlength="3" maxlength="50" autocomplete="off" required>
        </label>

        <label class="campo">
          <span>Senha</span>
          <input type="password" name="senha" id="campo-senha" minlength="6" maxlength="100" autocomplete="new-password" required>
          <small class="dica" id="dica-senha" hidden>Deixe em branco para manter a senha atual.</small>
        </label>

        <label class="campo">
          <span>Tipo de usuário</span>
          <select name="tipo_usuario" required>
            <option value="">Selecione</option>
            <option value="admin">Administrador</option>
            <option value="medico">Médico</option>
          </select>
        </label>

        <div class="formulario-botoes">
          <button type="submit" class="botao botao-principal" id="botao-salvar">Cadastrar</button>
          <button type="button" class="botao botao-contorno" id="botao-cancelar" hidden>Cancelar edição</button>
        </div>
      </form>

      <!-- Mensagem de sucesso ou erro -->
      <p class="mensagem" id="mensagem" hidden></p>
    </section>

    <!-- Lista de usuários -->
    <section class="caixa">
      <div class="caixa-cabecalho">
        <h2>Usuários cadastrados</h2>
        <span class="contador" id="contador">0</span>
      </div>

      <div class="tabela-rolagem" id="tabela-usuarios">
        <table class="tabela">
          <thead>
            <tr>
              <th>Login</th>
              <th>Tipo</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="lista-usuarios"></tbody>
        </table>
      </div>

      <p class="lista-vazia" id="lista-vazia" hidden>Nenhum usuário cadastrado ainda.</p>
    </section>

  </main>

  <!-- Rodapé -->
  <footer class="rodape">
    <div class="container">
      Hospital John Knox · <span id="ano"></span>
    </div>
  </footer>

  <script src="js/comum.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
